name: WakaTime languages chart

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install pygal

      - run: python scripts/wakatime-chart.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/wakatime-languages.svg
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "docs(readme): update WakaTime languages chart

          Assisted-by: ZCode"
          git push
